# Die IP-Adresse wird gekürzt protokolliert: nur die ersten drei Blöcke, bei IPv6 die ersten drei Gruppen.
map $remote_addr $anonymized_addr {
  ~^(?<ip4>\d+\.\d+\.\d+)\.\d+$ $ip4.0;
  ~^(?<ip6>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*): $ip6::;
  default 0.0.0.0;
}

log_format anonymized '$anonymized_addr [$time_local] "$request_method $uri" $status $body_bytes_sent';

server {
  listen 8080;
  server_tokens off;
  root /usr/share/nginx/html;
  index index.html;

  access_log /var/log/nginx/access.log anonymized;

  # Die Seite sendet nichts. Diese Regel ergänzt die im HTML um frame-ancestors, das nur als Header wirkt.
  add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

  location / {
    try_files $uri $uri/ =404;
  }

  # Dateinamen unter assets enthalten eine Prüfsumme und ändern sich mit dem Inhalt.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src data:; connect-src 'none'; form-action 'none'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  }
}
